name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Checking Java version and environment..."
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java output: $JAVA_VER_OUTPUT"

          MAJOR_VER=$(echo "$JAVA_VER_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$MAJOR_VER" ] || ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to detect Java version from '$JAVA_VER_OUTPUT'"
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Detected Java major version $MAJOR_VER is lower than 17"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Keystore ./debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::debug.keystore was not created or found"
            exit 1
          fi

          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "::error::Target APK $TARGET_APK not found!"
            echo "Searching app/build/outputs/apk for diagnostic information:"
            find app/build/outputs/apk -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -f "$TARGET_APK" ] || [ ! -s "$TARGET_APK" ]; then
            echo "::error::$TARGET_APK is not a regular file or is empty"
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "::error::$TARGET_APK does not have .apk extension"
              exit 1
              ;;
          esac

          echo "Confirmed valid APK at $TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_DIR/app-debug.apk"
          echo "release_asset_path=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version || { echo "::error::GitHub CLI not available"; exit 1; }

          ASSET_FILE="${{ steps.prep_asset.outputs.release_asset_path }}"
          if [ ! -f "$ASSET_FILE" ]; then
            echo "::error::Prepared APK release asset does not exist at $ASSET_FILE"
            exit 1
          fi

          if [ ! -s "$ASSET_FILE" ]; then
            echo "::error::Prepared APK release asset is empty"
            exit 1
          fi

          case "$ASSET_FILE" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset does not end in .apk"
              exit 1
              ;;
          esac

          ASSET_FILENAME=$(basename "$ASSET_FILE")
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "::error::Release asset filename is '$ASSET_FILENAME', expected 'app-debug.apk'"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - APK is intended for testing.
          - APK is not a Play Store production release.
          - APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            gh release view "$RELEASE_TAG" || true

            echo "Release tag: $RELEASE_TAG"
            echo "Release title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "APK filename: app-debug.apk"

            DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Direct APK URL: $DIRECT_APK_URL"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_APK_URL"
              echo ""
              echo "The normal Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete successfully."
            echo "The APK build succeeded and the backup Actions artifact \`app-debug-apk\` is available."
            {
              echo "## APK BUILD NOTICE"
              echo ""
              echo "GitHub Release publishing did not complete, but the debug APK was built successfully."
              echo "The Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
