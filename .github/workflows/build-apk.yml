name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK as a GitHub Release (for direct 1-tap phone download)'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Custom tag name for release (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & Export APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Build Environment
        run: |
          echo "Preparing executable permissions and local configs..."
          chmod +x gradlew

          # Restore debug keystore if encoded version exists
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Ensure .env file exists for secrets-gradle-plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Generated APK
        id: verify_apk
        run: |
          if [ ! -f "build-outputs/app-debug.apk" ]; then
            echo "::error::build-outputs/app-debug.apk does not exist!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "build-outputs/app-debug.apk" 2>/dev/null || stat -f%z "build-outputs/app-debug.apk")
          if [ "$FILE_SIZE" -le 1000 ]; then
            echo "::error::build-outputs/app-debug.apk is empty or invalid (size: $FILE_SIZE bytes)!"
            exit 1
          fi

          echo "APK generated and verified successfully!"
          echo "Path: build-outputs/app-debug.apk"
          echo "Size: $FILE_SIZE bytes ($(numfmt --to=iec-i --suffix=B $FILE_SIZE 2>/dev/null || echo "$FILE_SIZE bytes"))"
          echo "apk_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-outputs/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (Optional)
        if: ${{ github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number)) }}
          name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Debug Build #{0}', github.run_number)) }}
          body: |
            ### Adaptive Exam Tutor - Debug APK Build
            - **Commit**: ${{ github.sha }}
            - **Build Run**: #${{ github.run_number }}
            - **File**: `app-debug.apk` (${{ steps.verify_apk.outputs.apk_size }} bytes)

            Download and install `app-debug.apk` directly on your Android phone!
          files: |
            build-outputs/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
